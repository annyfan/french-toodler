<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Soft circular backdrop -->
  <circle cx="50" cy="50" r="46" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
  
  <!-- Sparkles / Clap action lines -->
  <path d="M 50 12 L 50 20 M 26 22 L 32 28 M 74 22 L 68 28 M 16 46 L 24 48 M 84 46 L 76 48" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <polygon points="50,18 53,24 59,25 54,29 56,35 50,32 44,35 46,29 41,25 47,24" fill="#FBBF24"/>
  <polygon points="26,30 28,34 32,35 29,38 30,42 26,40 22,42 23,38 20,35 24,34" fill="#FBBF24"/>
  <polygon points="74,30 76,34 80,35 77,38 78,42 74,40 70,42 71,38 68,35 72,34" fill="#FBBF24"/>

  <!-- Left Clapping Hand -->
  <g transform="rotate(-15 42 62)">
    <!-- Palm and fingers -->
    <path d="M 32 78 C 30 74 28 66 30 58 C 32 48 38 42 42 42 C 45 42 46 45 45 52 L 44 58 L 47 48 C 48 45 51 45 52 48 C 53 51 51 56 49 60 L 53 52 C 54 49 57 50 57 53 C 57 56 54 62 51 66 L 50 78 C 46 84 36 84 32 78 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>
    <!-- Sleeve -->
    <path d="M 28 76 L 46 76 C 46 82 28 82 28 76 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>
  </g>

  <!-- Right Clapping Hand -->
  <g transform="rotate(15 58 62)">
    <!-- Palm and fingers -->
    <path d="M 68 78 C 70 74 72 66 70 58 C 68 48 62 42 58 42 C 55 42 54 45 55 52 L 56 58 L 53 48 C 52 45 49 45 48 48 C 47 51 49 56 51 60 L 47 52 C 46 49 43 50 43 53 C 43 56 46 62 49 66 L 50 78 C 54 84 64 84 68 78 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>
    <!-- Sleeve -->
    <path d="M 72 76 L 54 76 C 54 82 72 82 72 76 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>
  </g>
</svg>