      <circle cx="12" cy="42" r="3" fill="#FDA4AF" opacity="0.8" />
      <circle cx="34" cy="42" r="3" fill="#FDA4AF" opacity="0.8" />
    </g>
    <!-- Right Bunny Slipper -->
