      <ellipse cx="46" cy="41" rx="5.5" ry="3.5" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
      <ellipse cx="46" cy="41" rx="2" ry="1.2" fill="#FFFFFF" />
