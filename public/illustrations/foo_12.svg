      <circle cx="50" cy="66" r="5" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
      <circle cx="62" cy="60" r="5" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
    </g>
