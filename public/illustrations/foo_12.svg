      <ellipse cx="60" cy="35" rx="2" ry="1.2" fill="#FFFFFF" />
      <ellipse cx="34" cy="40" rx="5.5" ry="3.5" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />
