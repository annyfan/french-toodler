      <path d="M 18 30 Q 30 24 40 32" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 20 46 Q 32 52 44 44" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </svg>