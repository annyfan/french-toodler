      <!-- Right column -->
      <circle cx="10" cy="-28" r="2.5" fill="#FDE047" />
      <circle cx="11" cy="-18" r="2.5" fill="#FDE047" />
      <circle cx="11" cy="-8" r="2.5" fill="#FDE047" />
